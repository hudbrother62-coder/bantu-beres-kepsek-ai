<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pemulihan Password — Bantu Beres Kepsek AI</title><link rel="stylesheet" href="/assets/styles.css"></head><body><main class="auth-page" style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="auth-panel" style="max-width:480px;width:100%"><div class="auth-box"><h1 id="recovery-title">Lupa password?</h1><p id="recovery-description">Masukkan alamat email yang sudah terdaftar.</p><p id="recovery-message" role="status" aria-live="polite"></p><form id="request-form"><label for="reset-email">Email terdaftar</label><input class="form-control" id="reset-email" type="email" required autocomplete="email"><button class="btn btn-primary btn-block" style="margin-top:16px">Kirim tautan pemulihan</button></form><form id="save-form" hidden><label for="new-password">Password baru</label><input class="form-control" id="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><label for="confirm-password">Konfirmasi password</label><input class="form-control" id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><button class="btn btn-primary btn-block" style="margin-top:16px">Simpan password</button></form><p style="margin-top:18px"><a href="/auth">Kembali ke login</a></p></div></section></main><script type="module" src="/assets/reset-password.js"></script></body></html>
